[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clustering-imagens"
version = "0.1.0"
description = "Agrupamento fuzzy não supervisionado de imagens de flores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "Pillow>=11.0,<13",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.67,<2",
]

[project.optional-dependencies]
extracao = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]
dev = [
    "pytest>=8.3,<10",
    "ty>=0.0.1",
]

[project.scripts]
inventariar-imagens = "clustering_imagens.inventario:principal"
extrair-caracteristicas = "clustering_imagens.caracteristicas:principal"
executar-piloto = "clustering_imagens.piloto:principal"
executar-experimentos = "clustering_imagens.experimentos:principal"
avaliar-quantidades-clusters = "clustering_imagens.avaliacao_clusters:principal"
gerar-pranchas = "clustering_imagens.analise_visual:principal"
analisar-estabilidade-imagens = "clustering_imagens.estabilidade_imagens:principal"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clustering_imagens*"]
