# Execução isolada para as 8.189 imagens válidas do dataset.
# Os resultados ficam dentro da pasta ignorada artefatos/completo e não
# sobrescrevem os artefatos do piloto de 500 imagens.
[projeto]
diretorio_imagens = "102flowers/jpg"
diretorio_artefatos = "artefatos/completo"

[inventario]
tamanho_amostra = 8189
semente = 42

[extracao]
tamanho_lote = 16
dispositivo = "auto"
trabalhadores = 0
diretorio_cache_modelos = ".cache/torch"

[piloto]
componentes_pca = 64
quantidade_clusters = 8
expoente_fuzzificacao = 1.2
semente = 42
semente_pca = 42
maximo_iteracoes = 300
tolerancia = 0.00001
inicializacao = "kmeans++"

[experimentos]
componentes_pca = [64]
sementes = [42, 123, 2026]
quantidade_clusters = 8
expoente_fuzzificacao = 1.2
semente_pca = 42
maximo_iteracoes = 1000
tolerancia = 0.00001

# Mantêm apenas a configuração promovida caso o pipeline completo seja usado.
[avaliacao_clusters]
quantidades_clusters = [8]
sementes = [42, 123, 2026]
componentes_pca = 64
expoente_fuzzificacao = 1.2
semente_pca = 42

[avaliacao_fuzzificacao]
expoentes = [1.20]
sementes = [42, 123, 2026]
componentes_pca = 64
quantidade_clusters = 8
semente_pca = 42
